<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1e293b;--mu:#64748b;--bd:#e2e8f0;--pr:#4338ca;--ok:#16a34a;--hu:#facc15;--pa:#f97316;--va:#dc2626;--na:#cbd5e1}

*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx)}

button{cursor:pointer}header button{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.4)}header button:hover{background:rgba(255,255,255,.3)}

nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;align-items:center}nav button{white-space:nowrap}nav .on{background:var(--pr);color:#fff;border-color:var(--pr)}.sp{flex:1}.pp{padding:7px 10px}

.k.ok{border-left-color:var(--ok)}.k.hu{border-left-color:var(--hu)}.k.pa{border-left-color:var(--pa)}.k.va{border-left-color:var(--va)}

<div><button onclick="$('#up').click()">⬆ Cargar reporte PDF</button> <button onclick="exXl()">⬇ Excel</button> <button onclick="exPdf()">⬇ PDF</button> <button onclick="bk()" title="Guarda todos los datos para abrirlos en otro dispositivo">💾 Respaldo JSON</button> <button onclick="$('#bk').click()">📂 Importar JSON</button></div></header>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<script>
const $=s=>document.querySelector(s),MIN=65;
const aplica=b=>{const n=+b.g[0];return!(['ING','FRA'].includes(b.m)&&n<4)&&!(b.m=='FRA'&&n==4)};
const SUB={ESP:'Lengua Española',MAT:'Matemática',CS:'Ciencias Sociales',CN:'Ciencias de la Naturaleza',EA:'Educación Artística',EF:'Educación Física',FI:'Formación Humana (FIHR)',ING:'Inglés',FRA:'Francés'};
const ORD=['ESP','MAT','CS','CN','EA','EF','FI','ING','FRA'],CORE=ORD.slice(0,7),ord=m=>{const i=ORD.indexOf(m);return i<0?99:i};
const C={Completa:'ok','Con huecos':'hu',Parcial:'pa','Vacía':'va','Crítica':'va',Alta:'pa',Moderada:'hu','Sin asignar':'na'};
const XC={Completa:'16A34A','Con huecos':'FACC15',Parcial:'FB923C','Vacía':'DC2626','Crítica':'DC2626',Alta:'FB923C',Moderada:'FACC15'};
const BC=['#dc2626','#f97316','#facc15','#84cc16','#16a34a'],BL=['< 65','65-69','70-79','80-89','90-100'];
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
let D=ld('cp_d',null),T=ld('cp_t',{l:[],a:{}}),H=ld('cp_h',[]),S={p:0,tab:'res',c:'',q:'',h:85,msg:'',sel:{t:'',c:[],m:[]}};if(D)D.blocks=D.blocks.filter(aplica);
const save=()=>{try{localStorage.cp_t=JSON.stringify(T);localStorage.cp_h=JSON.stringify(H);D?localStorage.cp_d=JSON.stringify(D):localStorage.removeItem('cp_d')}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f1=x=>x==null?'-':x.toFixed(1),pc=p=>p>=99.99?'ok':p>=S.h?'hu':p>0?'pa':'va';
const bd=s=>`<span class="bd b-${C[s]}">${s}</span>`;
const tx=c=>c&&typeof c=='object'?(c.b!=null?Math.round(c.b)+'%':c.d.join(' / ')):c;
const cell=c=>c&&typeof c=='object'?(c.b!=null?`<div class=pb><i class="b-${pc(c.b)}" style="width:${c.b}%"></i><span>${Math.round(c.b)}%</span></div>`:`<div class=sb>${c.d.map((v,i)=>`<i style="flex:${v};background:${BC[i]}" title="${BL[i]}: ${v}"></i>`).join('')}</div>`):(C[c]?bd(c):esc(c));
const tbl=(h,r)=>r.length?`<div class=tw><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.slice(0,600).map(x=>`<tr>${x.map(c=>`<td>${cell(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${r.length>600?`<p class=em>Mostrando 600 de ${r.length}. Exporta a Excel/PDF para ver todo.</p>`:''}`:'<p class=em>Sin registros para mostrar ✔</p>';
const hasP=p=>D.blocks.some(b=>b.st.some(s=>[0,1,2].some(c=>s.v[c*4+p]!=null)));
const lastP=()=>{let k=0;[0,1,2,3].forEach(p=>{if(hasP(p))k=p});return k};
const flt=r=>r.filter(x=>(!S.c||x[0]==S.c)&&(!S.q||x.map(tx).join(' ').toLowerCase().includes(S.q)));
const dl=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()};

/* ---------- Lectura del PDF ---------- */
async function parse(buf){
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:buf}).promise,blocks=[],meta={};let cur=null;
  const DX=[236,255,274,294,314,333,352,372,392,411,431,450];let X=DX;
  for(let i=1;i<=pdf.numPages;i++){
    const tc=await(await pdf.getPage(i)).getTextContent(),rows=[];
    tc.items.filter(t=>t.str.trim()).forEach(t=>{const y=t.transform[5];let r=rows.find(r=>Math.abs(r.y-y)<3);if(!r)rows.push(r={y,it:[]});r.it.push({s:t.str.trim(),x:t.transform[4]})});
    rows.sort((a,b)=>b.y-a.y);
    rows.forEach((r,ri)=>{
      r.it.sort((a,b)=>a.x-b.x);const t=r.it.map(z=>z.s).join(' ');let m;
      if(i==1&&ri==0&&!meta.e)meta.e=t;
      if(!meta.y&&(m=t.match(/Periodo Escolar:\s*(\S+)/)))meta.y=m[1];
      if(m=t.match(/Grado:\s*(\S+)\s+Servicio:\s*\S+\s+Mat:\s*(\S+)/)){cur={g:m[1],m:m[2],st:[]};blocks.push(cur);X=DX;return}
      if(t.includes('No.')){const p=r.it.filter(z=>/^P[1-4]$/.test(z.s)).map(z=>z.x);if(p.length==12)X=p;return}
      const f=r.it[0];
      if(cur&&/^\d+$/.test(f.s)&&f.x<32){
        const v=Array(12).fill(null);
        r.it.filter(z=>z.x>=225&&z.x<X[11]+12&&/^\d+(\.\d+)?$/.test(z.s)).forEach(z=>{let k=0,b=1e9;X.forEach((x,j)=>{const d=Math.abs(x-z.x);if(d<b){b=d;k=j}});v[k]=+z.s});
        cur.st.push({n:+f.s,nom:r.it.filter(z=>z.x>=32&&z.x<131).map(z=>z.s).join(' '),ape:r.it.filter(z=>z.x>=131&&z.x<225).map(z=>z.s).join(' '),v});
      }
    });
  }
  return{...meta,blocks:blocks.filter(b=>b.st.length&&aplica(b))};
}
async function cargar(f){
  if(!f)return;$('#busy').style.display='flex';
  try{
    const d=await parse(await f.arrayBuffer());
    if(!d.blocks.length)throw Error('No se reconocieron tablas de calificaciones en este PDF.');
    d.f=f.name;d.t=Date.now();const key=b=>b.g+'|'+b.m,nk=new Set(d.blocks.map(key)),n=d.blocks.length;
    if(D)d.blocks=[...D.blocks.filter(b=>!nk.has(key(b))),...d.blocks];
    d.blocks.sort((a,b)=>a.g.localeCompare(b.g)||ord(a.m)-ord(b.m));
    D=d;S.p=lastP();
    const e={k:S.p,t:d.t,f:f.name,p:[0,1,2,3].map(p=>{const B=calc(p),t=B.reduce((a,b)=>a+b.tot,0);return B.some(b=>b.f)?B.reduce((a,b)=>a+b.f,0)/t*100:null})},i=H.findIndex(h=>h.k==e.k);
    i>=0?H[i]=e:H.push(e);H=H.slice(-20);
    S.msg=`Reporte «${f.name}» cargado: ${n} asignaturas actualizadas · Periodo ${S.p+1}${i>=0?' (reemplazó la carga anterior de este periodo)':''}.`;
    save();render();
  }catch(e){alert('Error al leer el PDF: '+e.message)}
  $('#busy').style.display='none';
}
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();cargar(e.dataTransfer.files[0])});

/* ---------- Cálculos ---------- */
function calc(p){return D.blocks.map(b=>{
  const n=b.st.length,tot=n*3;let f=0;const miss=[],low=[];
  b.st.forEach(s=>{const mc=[],lc=[];[0,1,2].forEach(c=>{const v=s.v[c*4+p];if(v==null)mc.push(c+1);else{f++;if(v<MIN)lc.push([c+1,v])}});if(mc.length)miss.push({s,mc});if(lc.length)low.push({s,lc})});
  const pct=tot?f/tot*100:0;
  return{...b,n,tot,f,pct,miss,low,t:T.a[b.g+'|'+b.m],stt:f==0?'Vacía':f==tot?'Completa':pct>=S.h?'Con huecos':'Parcial'};
})}
const ST=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),n=s.length,m=s.reduce((x,y)=>x+y,0)/n,md=n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2,sd=Math.sqrt(s.reduce((x,y)=>x+(y-m)**2,0)/n),q=(lo,hi)=>a.filter(v=>v>=lo&&v<hi).length;return{n,m,md,sd,mn:s[0],mx:s[n-1],lo:q(-1,MIN)/n*100,bands:[q(-1,MIN),q(MIN,70),q(70,80),q(80,90),q(90,1e9)]}};
function R(){
  const p=S.p,B=calc(p),tn=b=>(T.l.find(x=>x.id==b.t)||{n:'Sin asignar'}).n,sn=b=>SUB[b.m]||b.m;
  const cnt=k=>B.filter(b=>b.stt==k).length,tot=B.reduce((a,b)=>a+b.tot,0),fl=B.reduce((a,b)=>a+b.f,0);
  const cum=B.map(b=>[b.g,sn(b),tn(b),b.n,b.tot,b.f,{b:b.pct},b.stt]);
  const gaps=[];B.filter(b=>b.stt=='Con huecos'||b.stt=='Parcial').forEach(b=>b.miss.forEach(m=>gaps.push([b.g,sn(b),tn(b),m.s.nom+' '+m.s.ape,m.mc.map(c=>'C'+c).join(', ')])));
  const low=[],A={};
  B.forEach(b=>b.low.forEach(l=>{const e=l.s.nom+' '+l.s.ape,mn=Math.min(...l.lc.map(x=>x[1]));low.push([b.g,sn(b),tn(b),e,l.lc.map(x=>'C'+x[0]+': '+x[1]).join(' · '),mn]);const a=A[b.g+e]=A[b.g+e]||{g:b.g,e,s:[],mn:100};a.s.push(b.m);a.mn=Math.min(a.mn,mn)}));
  const rk={'Crítica':0,Alta:1,Moderada:2};
  const al=Object.values(A).map(a=>[a.g,a.e,a.s.length,a.mn,a.s.length>=3||a.mn<40?'Crítica':a.s.length==2?'Alta':'Moderada',a.s.join(', ')]).sort((x,y)=>rk[x[4]]-rk[y[4]]||y[2]-x[2]||x[3]-y[3]);
  const sa=B.filter(b=>b.low.length/b.n>=.15).sort((x,y)=>y.low.length/y.n-x.low.length/x.n).map(b=>{const r=b.low.length/b.n*100;return[b.g,sn(b),tn(b),b.low.length+' de '+b.n,Math.round(r)+'%',r>=30?'Crítica':'Alta']});
  const vals=(bs,c)=>bs.flatMap(b=>b.st.flatMap(s=>(c==null?[0,1,2]:[c]).map(k=>s.v[k*4+p]).filter(v=>v!=null)));
  const sr=(l,a)=>{const s=ST(a);return s?[l,s.n,f1(s.m),f1(s.md),f1(s.sd),s.mn,s.mx,f1(s.lo)+'%',{d:s.bands}]:[l,0,'-','-','-','-','-','-',{d:[0,0,0,0,0]}]};
  const ev=b=>b.st.filter(s=>[0,1,2].some(c=>s.v[c*4+p]!=null)).length,RS={};
  B.forEach(b=>b.low.forEach(l=>{const e=l.s.nom+' '+l.s.ape,a=RS[b.g+e]=RS[b.g+e]||{g:b.g,e,i:[]};a.i.push(b.m+' ('+l.lc.map(x=>'C'+x[0]+': '+x[1]).join(', ')+')')}));
  const rec=Object.values(RS).sort((x,y)=>y.i.length-x.i.length||x.g.localeCompare(y.g)||x.e.localeCompare(y.e)).map(a=>[a.g,a.e,a.i.length,a.i.join(' · ')]);
  const rg=(l,bs)=>{const e=bs.reduce((a,b)=>a+ev(b),0),c=bs.reduce((a,b)=>a+b.low.length,0);return[l,e,c,e?Math.round(c/e*100)+'%':'-']};
  const subs=[...new Set(B.map(b=>b.m))].sort((a,b)=>ord(a)-ord(b)),cur=[...new Set(B.map(b=>b.g))].sort();
  const sS=subs.map(m=>sr(SUB[m]||m,vals(B.filter(b=>b.m==m)))),cS=cur.map(g=>sr('Curso '+g,vals(B.filter(b=>b.g==g)))),kS=[0,1,2].map(c=>sr('Competencia C'+(c+1),vals(B,c)));
  const cs=cur.map(g=>{const bs=B.filter(b=>b.g==g),t=bs.reduce((a,b)=>a+b.tot,0),f=bs.reduce((a,b)=>a+b.f,0),k=s=>bs.filter(b=>b.stt==s).length;return[g,bs.length,k('Completa'),k('Con huecos'),k('Parcial'),k('Vacía'),{b:t?f/t*100:0}]});
  const rS=subs.map(m=>rg(SUB[m]||m,B.filter(b=>b.m==m))),rC=cur.map(g=>rg('Curso '+g,B.filter(b=>b.g==g)));
  const grp=bs=>{const o={};bs.forEach(b=>(o[b.m]=o[b.m]||[]).push(b.g));return Object.keys(o).sort((a,b)=>ord(a)-ord(b)).map(m=>m+': '+o[m].sort().join(', ')).join(' · ')};
  const asg=[];T.l.forEach(t=>{const o={};B.filter(b=>b.t==t.id).forEach(b=>(o[b.m]=o[b.m]||[]).push(b.g));Object.keys(o).sort((a,b)=>ord(a)-ord(b)).forEach(m=>asg.push([t.n,SUB[m]||m,o[m].sort().join(', ')]))});
  asg.sort((a,b)=>a[0].localeCompare(b[0]));
  const tr=[...T.l.map(t=>[t.id,t.n]),['','Sin asignar']].map(([id,n])=>{const bs=B.filter(b=>(b.t||'')==id);if(!bs.length&&(id==''||0))return null;const t=bs.reduce((a,b)=>a+b.tot,0),f=bs.reduce((a,b)=>a+b.f,0),k=s=>bs.filter(b=>b.stt==s).length;return[n,bs.length,grp(bs),k('Completa'),k('Con huecos'),k('Parcial'),k('Vacía'),{b:t?f/t*100:0}]}).filter(Boolean);
  return{B,cnt,tot,fl,pct:tot?fl/tot*100:0,cum,gaps,low,al,sa,sS,cS,kS,cs,tr,asg,rec,rS,rC,gl:ST(vals(B)),tn,sn};
}
const SHB=['Grupo','N notas','Media','Mediana','Desv. est.','Mín','Máx','% < 65','Distribución <65 / 65-69 / 70-79 / 80-89 / 90+'];
const SH=r=>[
 {n:'Cumplimiento',h:['Curso','Asignatura','Docente','Estudiantes','Celdas esperadas','Celdas con nota','% cumplimiento','Estado'],r:r.cum},
 {n:'Por curso',h:['Curso','Asignaturas','Completas','Con huecos','Parciales','Vacías','% cumplimiento'],r:r.cs},
 {n:'Huecos',h:['Curso','Asignatura','Docente','Estudiante','Competencias sin nota'],r:r.gaps},
 {n:'Alertas de estudiantes',h:['Curso','Estudiante','Asignaturas < 65','Nota más baja','Nivel de alerta','Asignaturas'],r:r.al},
 {n:'Recuperación pedagógica',h:['Curso','Estudiante','Asignaturas en recuperación','Asignaturas (competencias y notas)'],r:r.rec},
 {n:'Recup. por asignatura',h:['Grupo','Estudiantes evaluados','Estudiantes en recuperación','% del grupo'],r:[...r.rS,...r.rC]},
 {n:'Menores de 65',h:['Curso','Asignatura','Docente','Estudiante','Competencias < 65','Nota más baja'],r:r.low},
 {n:'Estadística',h:SHB,r:[...r.sS,...r.kS,...r.cS]},
 {n:'Asignaciones docentes',h:['Docente','Asignatura','Cursos'],r:r.asg},
 {n:'Docentes',h:['Docente','Asignaturas asignadas','Detalle','Completas','Con huecos','Parciales','Vacías','% cumplimiento'],r:r.tr}];

/* ---------- Vistas ---------- */
const TABS=[['res','Resumen'],['det','Detalle'],['hue','Huecos'],['rie','Riesgo < 65'],['rec','Recuperación'],['est','Estadística'],['doc','Docentes']];
function render(){
  $('#sub').textContent=D?`${D.e||''} · Año escolar ${D.y||''} · ${D.f} (${new Date(D.t).toLocaleDateString('es-DO')})`:'Sube un reporte para comenzar';
  const cursos=D?[...new Set(D.blocks.map(b=>b.g))].sort().map(g=>`<option ${g==S.c?'selected':''}>${g}</option>`).join(''):'';
  $('#app').innerHTML=`<nav>${TABS.map(([k,l])=>`<button class="${S.tab==k?'on':''}" onclick="S.tab='${k}';S.msg='';render()">${l}</button>`).join('')}<span class=sp></span>${[0,1,2,3].map(p=>`<button class="pp ${S.p==p?'on':''}" onclick="S.p=${p};render()">P${p+1}${D&&hasP(p)?' ●':''}</button>`).join('')}</nav>
  ${D&&['det','hue','rie','rec'].includes(S.tab)?`<div class=fb><select onchange="S.c=this.value;view()"><option value="">Todos los cursos</option>${cursos}</select><input placeholder="Buscar estudiante, asignatura, docente o estado…" value="${esc(S.q)}" oninput="S.q=this.value.toLowerCase();view()"></div>`:''}${S.msg?`<div class=note style="border-left-color:var(--ok)">${esc(S.msg)}</div>`:''}<div id=v></div>`;
  view();
}
function view(){
  if(!D&&S.tab!='doc')return $('#v').innerHTML=`<div class=up onclick="$('#up').click()"><b>⬆ Arrastra aquí el reporte de calificaciones (PDF)</b><p>o haz clic para seleccionarlo. Todo se procesa en tu dispositivo; nada se sube a internet.</p></div>`;
  const r=D?R():null;$('#v').innerHTML=({res:vRes,det:vDet,hue:vHue,rie:vRie,rec:vRec,est:vEst,doc:vDoc})[S.tab](r);
}
const kp=a=>`<div class=kp>${a.map(([l,v,c])=>`<div class="k ${c}"><b>${v}</b><span>${l}</span></div>`).join('')}</div>`;
const lgS=`<div class=lg><span><i class=b-ok></i>Completa (100%)</span><span><i class=b-hu></i>Con huecos (≥ ${S.h}%)</span><span><i class=b-pa></i>Parcial (&lt; ${S.h}%)</span><span><i class=b-va></i>Vacía (0%)</span><span><i class=b-na></i>No aplica</span></div>`;
function vRes(r){
  const ms=ORD.filter(m=>CORE.includes(m)||r.B.some(b=>b.m==m)),gs=[...new Set(r.B.map(b=>b.g))].sort();
  const hm=gs.map(g=>{const bs=r.B.filter(b=>b.g==g),t=bs.reduce((a,b)=>a+b.tot,0),f=bs.reduce((a,b)=>a+b.f,0);
    return`<tr><td><b>${g}</b> <small>${t?Math.round(f/t*100):0}%</small></td>${ms.map(m=>{const b=bs.find(x=>x.m==m);return b?`<td class="b-${C[b.stt]}" title="${esc(r.sn(b)+' · '+r.tn(b)+' · '+b.f+'/'+b.tot+' celdas · '+b.stt)}">${Math.round(b.pct)}%</td>`:CORE.includes(m)?`<td class=b-va>Falta</td>`:`<td class=b-na>—</td>`}).join('')}</tr>`}).join('');
  const pri=r.B.filter(b=>b.stt=='Vacía'||b.stt=='Parcial').sort((a,b)=>a.pct-b.pct).map(b=>[b.g,r.sn(b),r.tn(b),{b:b.pct},b.stt]);
  return`${hasP(S.p)?'':`<div class=note>Todavía no hay notas cargadas para el <b>Periodo ${S.p+1}</b>. Elige otro periodo (● = con datos).</div>`}
  ${kp([['Cumplimiento global · P'+(S.p+1),Math.round(r.pct)+'%',pc(r.pct)],['Asignaturas completas',r.cnt('Completa'),'ok'],['Con huecos',r.cnt('Con huecos'),'hu'],['Parciales',r.cnt('Parcial'),'pa'],['Vacías',r.cnt('Vacía'),'va'],['Estudiantes con alerta (&lt;65)',r.al.length,r.al.length?'va':'ok']])}
  <h2>Mapa de cumplimiento por curso y asignatura</h2>${lgS}<div class=tw><table class=hm><thead><tr><th>Curso</th>${ms.map(m=>`<th title="${SUB[m]||m}">${m}</th>`).join('')}</tr></thead><tbody>${hm}</tbody></table></div>
  <h2>Atención prioritaria (retrasos e incumplimientos)</h2>${tbl(['Curso','Asignatura','Docente','Cumplimiento','Estado'],pri.slice(0,15))}
  <h2>Historial de cargas</h2><p class=lg>Si subes otro reporte del mismo periodo, su fila se actualiza.</p>${tbl(['Fecha','Archivo','Periodo cargado','Cumplimiento P1','P2','P3','P4'],[...H].sort((a,b)=>b.t-a.t).map(h=>[new Date(h.t).toLocaleString('es-DO'),h.f,h.k==null?'-':'P'+(h.k+1),...h.p.map(x=>x==null?'-':{b:x})]))}`;
}
function vDet(r){
  return`<p>Umbral para «Con huecos»: <input type=number min=50 max=99 value=${S.h} style="width:70px" onchange="S.h=+this.value;render()"> % de celdas con nota.</p>${lgS}<h2>Resumen por curso</h2>${tbl(['Curso','Asignaturas','Completas','Con huecos','Parciales','Vacías','Cumplimiento'],r.cs)}<h2>Cada asignatura de cada curso</h2>${tbl(['Curso','Asignatura','Docente','Estudiantes','Esperadas','Con nota','Cumplimiento','Estado'],flt(r.cum))}`;
}
function vHue(r){
  const n=r.B.filter(b=>b.stt=='Con huecos').length;
  return`<p>Asignaturas <b>casi completas</b> (con huecos): <b>${n}</b>. Aquí se indica qué estudiante y qué competencia no tiene nota. Las asignaturas «Parciales» también se listan; las «Vacías» solo aparecen en Detalle.</p>${tbl(['Curso','Asignatura','Docente','Estudiante','Competencias sin nota'],flt(r.gaps))}`;
}
function vRie(r){
  const n=l=>r.al.filter(a=>a[4]==l).length;
  return`${kp([['Alerta crítica (≥3 asignaturas o nota &lt;40)',n('Crítica'),'va'],['Alerta alta (2 asignaturas)',n('Alta'),'pa'],['Alerta moderada (1 asignatura)',n('Moderada'),'hu'],['Asignaturas con ≥15% de estudiantes &lt;65',r.sa.length,r.sa.length?'va':'ok']])}
  <h2>Asignaturas con alta insuficiencia</h2>${tbl(['Curso','Asignatura','Docente','Estudiantes &lt;65','% del grupo','Alerta'],flt(r.sa))}
  <h2>Estudiantes con alerta</h2>${tbl(['Curso','Estudiante','Asignaturas &lt;65','Nota más baja','Alerta','Asignaturas'],flt(r.al))}
  <h2>Detalle: competencias por debajo de 65</h2>${tbl(['Curso','Asignatura','Docente','Estudiante','Competencias &lt;65','Nota más baja'],flt(r.low))}`;
}
function vRec(r){
  const top=[...r.rS].sort((a,b)=>b[2]-a[2])[0],H4=['Grupo','Estudiantes evaluados','Estudiantes en recuperación','% del grupo'];
  return`<p>Estudiantes con <b>recuperación pedagógica</b> en el Periodo ${S.p+1}: tienen al menos una competencia por debajo de <b>${MIN}</b> en la asignatura, y la recuperan en esa asignatura.</p>
  ${kp([['Estudiantes con recuperación',r.rec.length,r.rec.length?'va':'ok'],['Casos (estudiante × asignatura)',r.low.length,r.low.length?'pa':'ok'],['Más casos: '+(top&&top[2]?top[0]:'—'),top?top[2]:0,'hu']])}
  <h2>Por asignatura</h2>${tbl(H4,r.rS)}<h2>Por curso</h2>${tbl(H4,r.rC)}
  <h2>Estudiantes en recuperación</h2>${tbl(['Curso','Estudiante','Asignaturas','Asignaturas (competencias y notas)'],flt(r.rec))}
  <h2>Detalle por asignatura y docente</h2>${tbl(['Curso','Asignatura','Docente','Estudiante','Competencias &lt;65','Nota más baja'],flt(r.low))}`;
}
function vEst(r){
  const g=r.gl;
  return`${g?kp([['Media general',f1(g.m),pc(g.m>=70?100:50)],['Mediana',f1(g.md),''],['Desviación estándar',f1(g.sd),''],['Notas &lt; 65',f1(g.lo)+'%',g.lo>10?'va':g.lo>0?'pa':'ok'],['Notas analizadas',g.n,'']]):'<p class=em>Sin notas en este periodo.</p>'}
  <div class=lg>${BL.map((l,i)=>`<span><i style="background:${BC[i]}"></i>${l}</span>`).join('')}</div>
  <h2>Por asignatura</h2>${tbl(SHB,r.sS)}<h2>Por competencia</h2>${tbl(SHB,r.kS)}<h2>Por curso</h2>${tbl(SHB,r.cS)}`;
}
function vDoc(r){
  const gs=D?[...new Set(D.blocks.map(b=>b.g))].sort():[],ms=D?ORD.filter(m=>CORE.includes(m)||D.blocks.some(b=>b.m==m)):[];
  const grid=D?`${panel()}<h2>Asignaciones por docente</h2>${tbl(['Docente','Asignatura','Cursos'],r.asg)}<h2>Ajuste fino por celda (curso × asignatura)</h2><div class=tw><table class=hm><thead><tr><th>Curso</th>${ms.map(m=>`<th title="${SUB[m]||m}">${m}</th>`).join('')}</tr></thead><tbody>${gs.map(g=>`<tr><td><b>${g}</b></td>${ms.map(m=>{const b=D.blocks.find(x=>x.g==g&&x.m==m);if(!b)return'<td>—</td>';const k=g+'|'+m;return`<td><select class=a onchange="asg('${k}',this.value)"><option value="">—</option>${T.l.map(t=>`<option value="${t.id}" ${T.a[k]==t.id?'selected':''}>${esc(t.n)}</option>`).join('')}</select></td>`}).join('')}</tr>`).join('')}</tbody></table></div>
  <h2>Responsabilidades y cumplimiento por docente · P${S.p+1}</h2>${tbl(['Docente','Asignaturas','Detalle','Completas','Con huecos','Parciales','Vacías','Cumplimiento'],r.tr)}`:'<p class=em>Carga un reporte para asignar docentes a cada curso y asignatura.</p>';
  return`<h2>Docentes registrados</h2><div>${T.l.map(t=>`<span class=chip>${esc(t.n)}<button title="Eliminar" onclick="delT('${t.id}')">✕</button></span>`).join('')||'<p class=em>Aún no hay docentes.</p>'}</div>
  <p><textarea id=nt rows=3 style="width:100%;max-width:420px" placeholder="Escribe uno o varios nombres (uno por línea)"></textarea><br><button onclick="addT()">+ Agregar docentes</button></p>${grid}`;
}
function panel(){
  const sl=S.sel,gs=[...new Set(D.blocks.map(b=>b.g))].sort(),grs=[...new Set(gs.map(g=>g[0]))],ms=ORD.filter(m=>CORE.includes(m)||D.blocks.some(b=>b.m==m));
  const mt=D.blocks.filter(b=>sl.c.includes(b.g)&&sl.m.includes(b.m)),ok=sl.t&&mt.length?'':'disabled',ch=(on,fn,l,t='')=>`<button class="ch ${on?'on':''}" title="${t}" onclick="${fn}">${l}</button>`;
  return`<h2>Asignar docente a cursos y asignaturas</h2><div class=pn>
  <p><b>1. Docente</b> <select onchange="S.sel.t=this.value;view()"><option value="">— elige —</option>${T.l.map(t=>`<option value="${t.id}" ${sl.t==t.id?'selected':''}>${esc(t.n)}</option>`).join('')}</select></p>
  <p><b>2. Cursos que atiende</b> (puedes marcar varios)<br>${grs.map(n=>ch(gs.filter(g=>g[0]==n).every(g=>sl.c.includes(g)),`tgG('${n}')`,'Todo '+n+'.º')).join('')}<br>${gs.map(g=>ch(sl.c.includes(g),`tg('c','${g}')`,g)).join('')}</p>
  <p><b>3. Asignaturas que imparte en esos cursos</b><br>${ms.map(m=>ch(sl.m.includes(m),`tg('m','${m}')`,SUB[m]||m,m)).join('')}</p>
  <p>${mt.length?`Se aplicarán <b>${mt.length}</b> combinaciones curso × asignatura.`:'Marca cursos y asignaturas. Las combinaciones que no existen en el reporte (p. ej. Francés en 4.º) se omiten.'}<br><button class=ch onclick="asgM(1)" ${ok}>✔ Asignar</button><button class=ch onclick="asgM(0)" ${ok}>✕ Quitar</button></p></div>`;
}
function tg(k,v){const a=S.sel[k],i=a.indexOf(v);i<0?a.push(v):a.splice(i,1);view()}
function tgG(n){const gs=[...new Set(D.blocks.map(b=>b.g))].filter(g=>g[0]==n),all=gs.every(g=>S.sel.c.includes(g));S.sel.c=S.sel.c.filter(g=>g[0]!=n);if(!all)S.sel.c.push(...gs);view()}
function asgM(add){
  const sl=S.sel,k=b=>b.g+'|'+b.m,mt=D.blocks.filter(b=>sl.c.includes(b.g)&&sl.m.includes(b.m)),nm=(T.l.find(t=>t.id==sl.t)||{}).n;let n=0;
  if(add){const cf=mt.filter(b=>T.a[k(b)]&&T.a[k(b)]!=sl.t);if(cf.length&&!confirm(cf.length+' asignaturas ya tienen otro docente (p. ej. '+k(cf[0])+'). ¿Reemplazarlas por '+nm+'?'))return;mt.forEach(b=>{T.a[k(b)]=sl.t;n++})}
  else mt.forEach(b=>{if(T.a[k(b)]==sl.t){delete T.a[k(b)];n++}});
  save();S.msg=(add?'Asignadas ':'Quitadas ')+n+' combinaciones '+(add?'a ':'de ')+nm+'.';render();
}
function addT(){$('#nt').value.split('\n').map(s=>s.trim()).filter(Boolean).forEach((n,i)=>T.l.push({id:'t'+Date.now()+i,n}));save();view()}
function delT(id){T.l=T.l.filter(t=>t.id!=id);Object.keys(T.a).forEach(k=>{if(T.a[k]==id)delete T.a[k]});save();view()}
function asg(k,v){v?T.a[k]=v:delete T.a[k];save();view()}
const bk=()=>dl(new Blob([JSON.stringify({app:'cumplimiento',v:1,exp:new Date().toISOString(),h:S.h,D,T,H})],{type:'application/json'}),`respaldo_cumplimiento_${new Date().toISOString().slice(0,10)}.json`);
async function rs(f){
  if(!f)return;
  try{
    const x=JSON.parse(await f.text());
    if(x.app=='cumplimiento'){
      if(D&&!confirm('Esto reemplazará los datos actuales de este dispositivo por los del respaldo. ¿Continuar?'))return;
      D=x.D?{...x.D,blocks:x.D.blocks.filter(aplica)}:null;T=x.T||{l:[],a:{}};H=x.H||[];S.h=x.h||85;if(D)S.p=lastP();
      S.msg='Respaldo importado'+(D?': '+D.f:'')+'.';
    }else if(x.l&&x.a){T=x;S.msg='Docentes importados.'}else throw 0;
    save();render();
  }catch(e){alert('Archivo no válido')}
}

/* ---------- Exportar ---------- */
async function exXl(){
  if(!D)return alert('Primero carga un reporte.');
  const wb=new ExcelJS.Workbook();
  SH(R()).forEach(s=>{
    const ws=wb.addWorksheet(s.n);ws.addRow(s.h);
    ws.getRow(1).eachCell(c=>{c.font={bold:true,color:{argb:'FFFFFFFF'}};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF4338CA'}}});
    s.r.forEach(x=>{const row=ws.addRow(x.map(tx));row.eachCell(c=>{const k=XC[c.value];if(k){c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF'+k}};c.font={bold:true,color:{argb:k=='FACC15'?'FF422006':'FFFFFFFF'}}}})});
    ws.columns.forEach((c,i)=>c.width=Math.min(48,Math.max(String(s.h[i]).length,...s.r.slice(0,300).map(x=>String(tx(x[i])).length))+3));
    ws.views=[{state:'frozen',ySplit:1}];ws.autoFilter={from:{row:1,column:1},to:{row:1,column:s.h.length}};
  });
  dl(new Blob([await wb.xlsx.writeBuffer()]),`Cumplimiento_P${S.p+1}_${new Date().toISOString().slice(0,10)}.xlsx`);
}
function exPdf(){
  if(!D)return alert('Primero carga un reporte.');
  const r=R(),d=new jspdf.jsPDF({orientation:'landscape',unit:'pt',format:'letter'});
  d.setFontSize(18);d.text('Reporte de cumplimiento de calificaciones - Periodo '+(S.p+1),40,45);d.setFontSize(10);
  [`${D.e||''}  |  Año escolar ${D.y||''}  |  Generado: ${new Date().toLocaleDateString('es-DO')}`,
   `Cumplimiento global: ${Math.round(r.pct)}%  |  Completas: ${r.cnt('Completa')}  |  Con huecos: ${r.cnt('Con huecos')}  |  Parciales: ${r.cnt('Parcial')}  |  Vacías: ${r.cnt('Vacía')}  |  Estudiantes con alerta (<65): ${r.al.length}`].forEach((t,i)=>d.text(t,40,66+i*15));
  SH(r).forEach((s,i)=>{
    if(i)d.addPage();d.setFontSize(13);d.text(s.n,40,i?40:112);
    d.autoTable({startY:i?50:120,head:[s.h],body:s.r.map(x=>x.map(tx)),styles:{fontSize:8,cellPadding:3},headStyles:{fillColor:[67,56,202]},
      didParseCell:h=>{const k=XC[h.cell.raw];if(h.section=='body'&&k){h.cell.styles.fillColor=[0,2,4].map(j=>parseInt(k.substr(j,2),16));h.cell.styles.textColor=k=='FACC15'?[66,32,6]:255;h.cell.styles.fontStyle='bold'}}});
  });
  d.save(`Cumplimiento_P${S.p+1}_${new Date().toISOString().slice(0,10)}.pdf`);
}
if(D)S.p=lastP();render();
</script></body></html>
